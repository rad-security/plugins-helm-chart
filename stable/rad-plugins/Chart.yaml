apiVersion: v2
name: rad-plugins
version: 2.4.17
description: A Helm chart to run the RAD Security plugins
home: https://rad.security
icon: https://app.rad.security/assets/favicon.svg
keywords:
  - security
  - rad
  - runtime
  - kubernetes
  - helm
maintainers:
  - name: RAD Security Engineering
    email: infrastructure@rad.security
annotations:
  artifacthub.io/category: security
  # Possible kind options are added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: security
      description: Bump rad-sbom to v1.1.73 with go-jose/go-jose/v4 v4.1.6 (GHSA-mgcc-cww5-fp2q)
    - kind: security
      description: Bump rad-guard to v1.1.46 with klauspost/compress v1.18.7 (GHSA-259r-337f-4rfw)
    - kind: changed
      description: Rebuild rad-bootstrapper v1.1.36, rad-sync v1.1.40, rad-watch v1.1.52, rad-runtime and rad-runtime-exporter v0.1.49 with updated internal libraries
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/rad-security/plugins-helm-chart
    - name: support
      url: https://github.com/rad-security/plugins-helm-chart/issues
