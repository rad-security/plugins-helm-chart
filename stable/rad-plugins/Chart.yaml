apiVersion: v2
name: rad-plugins
version: 2.4.19
description: A Helm chart to run the RAD Security plugins
home: https://rad.security
icon: https://app.rad.security/assets/favicon.svg
keywords:
  - security
  - rad
  - runtime
  - kubernetes
  - helm
maintainers:
  - name: RAD Security Engineering
    email: infrastructure@rad.security
annotations:
  artifacthub.io/category: security
  # Possible kind options are added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: added
      description: Plugin images ship a THIRD_PARTY_NOTICES.txt (license and notice texts of bundled open-source components) at /var/run/ko/; rad-runtime images also carry the GPL-2.0 NOTICE
    - kind: changed
      description: Bump bootstrapper v1.1.37, guard v1.1.48, sbom v1.1.75, sync v1.1.42, watch v1.1.54, runtime and exporter v0.1.50
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/rad-security/plugins-helm-chart
    - name: support
      url: https://github.com/rad-security/plugins-helm-chart/issues
