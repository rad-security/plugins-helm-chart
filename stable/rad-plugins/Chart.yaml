apiVersion: v2
name: rad-plugins
version: 2.4.15
description: A Helm chart to run the RAD Security plugins
home: https://rad.security
icon: https://app.rad.security/assets/favicon.svg
keywords:
  - security
  - rad
  - runtime
  - kubernetes
  - helm
maintainers:
  - name: RAD Security Engineering
    email: infrastructure@rad.security
annotations:
  artifacthub.io/category: security
  # Possible kind options are added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: security
      description: Bump rad-runtime and rad-runtime-exporter to v0.1.47 for google.golang.org/grpc, containerd, docker/moby, cilium/ebpf, gopacket, oras-go, otel, golang.org/x/text and klauspost/compress vulnerabilities (containerd moved to v2, docker to the moby/moby client)
    - kind: security
      description: Bump rad-sbom to v1.1.71 for google.golang.org/grpc GHSA-2v4p-qf9q-27wj, containerd GHSA-7jxh-36q5-gcqv, otel/sdk GHSA-8wmf-6v46-5gfg, klauspost/compress GO-2026-5841 and golang.org/x/crypto GO-2026-5932
    - kind: fixed
      description: rad-runtime socket enricher falls back to eBPF address resolution when /proc/kallsyms hides kernel addresses, so connections on sockets opened before the agent started are attributed to their process
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/rad-security/plugins-helm-chart
    - name: support
      url: https://github.com/rad-security/plugins-helm-chart/issues
